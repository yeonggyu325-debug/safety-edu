<!doctype html>
<html lang="ko">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>최초 관리자 설정</title><link rel="stylesheet" href="/css/setup.css"></head>
<body><main><h1>최초 관리자 설정</h1><p>서버 PC에서 관리자 이메일과 비밀번호를 등록하세요. 등록한 계정으로 사원·부서 관리를 시작할 수 있습니다.</p><form id="setupForm">
<label for="email">관리자 이메일</label><input id="email" type="email" autocomplete="username" maxlength="254" required>
<label for="password">비밀번호</label><input id="password" type="password" autocomplete="new-password" minlength="12" maxlength="128" required><small>12자 이상으로 입력하세요.</small>
<label for="confirmPassword">비밀번호 확인</label><input id="confirmPassword" type="password" autocomplete="new-password" required>
<button id="submitButton" type="submit">관리자 등록</button><p id="message" role="status"></p></form><a href="/">교육자료실로 이동</a></main><script src="/js/setup.js"></script></body></html>
