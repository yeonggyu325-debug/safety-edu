<!doctype html>
<html lang="ko">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>관리자 로그인</title><link rel="stylesheet" href="/css/setup.css"></head>
<body><main><h1>관리자 로그인</h1><p>관리자 이메일과 비밀번호로 로그인하세요.</p><p><a href="/">교육자료 열람으로 돌아가기</a></p>
<form id="loginPageForm"><label for="email">이메일</label><input id="email" type="email" autocomplete="username" maxlength="254" required>
<label for="password">비밀번호</label><input id="password" type="password" autocomplete="current-password" maxlength="128" required>
<button id="submitButton" type="submit">로그인</button><p id="message" role="status" aria-live="polite"></p></form>
<a id="setupLink" href="/setup.html" hidden>최초 관리자 설정</a></main><script src="/js/login.js"></script></body></html>
